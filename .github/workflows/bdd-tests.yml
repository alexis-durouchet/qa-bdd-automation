name: BDD Automated Tests

# Declenchement du workflow
on:
  push:
    branches:
      - main
      - 'features/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Configuration des permissions
permissions:
  contents: read

# Definition du job
jobs:
  bdd-tests:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Donnees fictives reservees au site de demonstration
    env:
      BASE_URL: https://automationexercise.com
      TEST_PASSWORD: "QaTest2026!E2E"
      PAYMENT_NAME: "Lucas Martin"
      PAYMENT_CARD_NUMBER: "4111111111111111"
      PAYMENT_CVC: "123"
      PAYMENT_EXPIRY_MONTH: "12"
      PAYMENT_EXPIRY_YEAR: "2030"

    steps:

      # Recuperation du depot GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installation de Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Installation des dependances
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Execution des tests et generation du rapport
      - name: Run BDD tests
        shell: bash
        run: |
          mkdir -p reports
          timestamp=$(date +'%Y-%m-%d_%H-%M-%S')
          set -o pipefail
          python -m behave --format plain --no-color 2>&1 | tee "reports/ci_bdd_report_$timestamp.txt"

      # Conservation du rapport meme en cas d'echec
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-test-report
          path: reports/ci_bdd_report_*.txt
          retention-days: 30